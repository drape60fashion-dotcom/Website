<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape60 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mu:#6b6b6b;--ln:#e8e6df;--sf:#f6f4ee;--ac:#f5c518;--on:#111;--rd:#c0392b;--gr:#2a8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--fg:#f5f5f2;--mu:#a0a09a;--ln:#2a2a28;--sf:#1a1a18;--rd:#ff6b5b;--gr:#4cc16a}}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.w{max-width:1100px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.hr{display:flex;align-items:center;gap:10px;padding:10px 0}.logo{font-weight:700;font-size:18px;flex:1}.logo b{background:var(--ac);color:var(--on);padding:0 5px;border-radius:5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--ln)}.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{padding:10px 16px;border-radius:10px;font-weight:600;background:var(--fg);color:var(--bg)}.btn.y{background:var(--ac);color:var(--on)}.btn.o{border:1px solid var(--fg);background:none;color:var(--fg)}.btn.r{border:1px solid var(--rd);background:none;color:var(--rd)}.btn.s{padding:6px 11px;font-size:13px}.btn.f{width:100%}
.card{border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
h2{font-size:18px;margin:18px 0 10px}.mu{color:var(--mu);font-size:13px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}.fg{grid-template-columns:repeat(4,1fr)!important}}
.kpi{background:var(--sf);border-radius:12px;padding:14px}.kpi b{font-size:21px;display:block;margin-top:4px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);margin:3px 0 8px;outline:0}input.f:focus{border-color:var(--fg)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--sf)}.tag.y{background:var(--ac);color:var(--on)}.tag.g{color:var(--gr)}.tag.r{color:var(--rd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500}tr[data-a]{cursor:pointer}
#modal{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:flex-end;justify-content:center}#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow-y:auto}@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:90;max-width:92%;text-align:center}
.login{max-width:420px;margin:10vh auto;padding:0 18px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:up .3s both}.btn{position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s}.btn:active{transform:scale(.97)}.btn.y:hover{box-shadow:0 8px 20px #f5c51877}
.btn.ld{pointer-events:none;color:transparent!important}.btn.ld::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.y.ld::after{border-color:var(--on);border-top-color:transparent}.sheet{animation:up .25s}.toast{animation:up .25s}
.ftr{text-align:center;color:var(--mu);font-size:12px;padding:26px 14px 36px;border-top:1px solid var(--ln);margin-top:34px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fl{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 10px;text-align:center}
.fl .rack{display:flex;gap:12px;align-items:flex-end;padding:14px 18px;border-radius:18px;background:var(--sf);max-width:100%;overflow:hidden}
.fl svg.o{width:42px;height:56px;flex:none;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linejoin:round;opacity:.3;animation:fo 3.6s infinite}
.fl svg.o:nth-child(2){animation-delay:.6s}.fl svg.o:nth-child(3){animation-delay:1.2s}.fl svg.o:nth-child(4){animation-delay:1.8s}.fl svg.o:nth-child(5){animation-delay:2.4s}.fl svg.o:nth-child(6){animation-delay:3s}
@keyframes fo{0%,100%{opacity:.3;transform:none;fill:none}8%,22%{opacity:1;transform:translateY(-9px);fill:#f5c51866;stroke:#b98a00}32%{opacity:.3;transform:none}}
.fl .bar{width:170px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}.fl .bar i{display:block;height:100%;width:40%;background:var(--ac);border-radius:2px;animation:slide 1.2s infinite}
@keyframes slide{from{margin-left:-40%}to{margin-left:100%}}
.fl .tp{position:relative;height:20px;width:270px;font-size:13px;color:var(--mu)}.fl .tp span{position:absolute;inset:0;opacity:0;animation:tp 8s infinite}.fl .tp span:nth-child(2){animation-delay:2s}.fl .tp span:nth-child(3){animation-delay:4s}.fl .tp span:nth-child(4){animation-delay:6s}
@keyframes tp{0%{opacity:0;transform:translateY(6px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0}}
.fchip{flex:none;padding:7px 14px;border:1px solid var(--ln);border-radius:20px;font-size:13px}.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style></head><body><div id="root"></div><footer class="ftr">© 2026 Drape60 · Admin · Hyderabad</footer><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),fm=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),lc=s=>String(s||'').toLowerCase();
const OUT=['M20 4h10l2 12-4 6 8 8-6 30H18L14 30l8-8-4-6z','M20 4h10l3 12H17zM17 16l-4 44h24l-4-44','M18 6l7-3 7 3 12 12-5 6-5-4v32H16V20l-5 4-5-6z','M16 6l9 4 9-4 12 10-6 8-4-3v31H14V21l-4 3-6-8z','M14 4h22l4 56H29l-4-36-4 36H10z','M20 4h10l2 16 14 40H4l14-40z'];
const FL=()=>`<div class="fl"><div class="logo" style="font-size:26px">Drape<b>60</b> Admin</div><div class="rack">${OUT.map(d=>`<svg class="o" viewBox="0 0 50 64"><path d="${d}"/></svg>`).join('')}</div><div class="bar"><i></i></div><div class="tp"><span>Loading stores…</span><span>Counting orders…</span><span>Checking verifications…</span><span>Syncing your Sheet…</span></div></div>`;
const API_URL='https://script.google.com/macros/s/AKfycbw4LnEmSac8VSTOkLUHKIfqgan7rFEpzMi5KUZvFnGwrElf4ax-C4vb7HNOXI99Gs8/exec';
const ld=(b,on)=>{if(b)b.classList.toggle('ld',!!on)};
let DEMO=0,URLX=API_URL||localStorage.getItem('d60_api')||'',KEY=sessionStorage.getItem('d60_k')||'',D={},T={v:'dash',cid:null,os:'',ost:''};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
const A=(a,d)=>DEMO?Promise.resolve({err:'Demo mode: connect your Sheet to save changes'}):fetch(URLX,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,d,k:KEY})}).then(r=>r.json()).catch(()=>({err:'Cannot reach the API. Check the URL and that access is set to Anyone.'}));
const today=()=>new Date().toISOString().slice(0,10),live=o=>['new','accepted','packing','packed','dispatched','picked'].includes(o.status);
function login(){$('#root').innerHTML=`<div class="login"><div class="logo" style="font-size:24px">Drape<b>60</b> Admin</div><p class="mu" style="margin:6px 0 18px">Connects to your Google Sheet through Apps Script.</p><input class="f" id="u" placeholder="Apps Script web app URL" value="${esc(URLX)}"><input class="f" id="k" type="password" placeholder="Admin key"><button class="btn y f" id="go">Open dashboard</button><button class="btn o f" id="dm" style="margin-top:8px">Try demo with sample data</button><p class="mu" style="margin-top:16px;line-height:1.6">Enter your admin key (the ADMIN_KEY value in Apps Script → Project Settings → Script properties).</p></div>`;
$('#go').onclick=()=>{URLX=$('#u').value.trim();KEY=$('#k').value;if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(URLX))return toast('Paste the Web app URL ending in /exec');if(!KEY)return toast('Enter your admin key');DEMO=0;localStorage.setItem('d60_api',URLX);sessionStorage.setItem('d60_k',KEY);ld($('#go'),1);load()};$('#dm').onclick=()=>{DEMO=1;D=sample();shell();toast('Demo mode: sample data, nothing is saved')}}
async function load(){if(DEMO)return shell();$('#root').innerHTML=FL();const r=await A('admin.boot');if(r.err){toast(r.err);return login()}D=r;shell()}
function shell(){$('#root').innerHTML=`<header><div class="w"><div class="hr"><div class="logo">Drape<b>60</b> Admin</div><button class="btn s o" id="rf">Refresh</button><button class="btn s o" id="lo">Log out</button></div><div class="tabs">${[['dash','Dashboard'],['orders','Orders'],['stores','Stores'],['coupons','Coupons'],['customers','Customers'],['offers','Banner']].map(t=>`<button class="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div></div></header><main class="w" id="m"></main>`;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{T.v=b.dataset.v;T.cid=null;show()});$('#rf').onclick=()=>load().then(()=>toast('Refreshed'));$('#lo').onclick=()=>{sessionStorage.removeItem('d60_k');KEY='';login()};show()}
function show(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v==T.v));$('#m').innerHTML=V[T.v]();bind()}
const tag=s=>`<span class="tag ${['done','active','approved','Verified'].includes(s)?'g':['rejected','disabled','Rejected','More Documents Required'].includes(s)?'r':['new','Pending','Under Review'].includes(s)?'y':''}">${esc(s)}</span>`;
function dash(){const O=D.orders,done=O.filter(o=>o.status=='done'),by={};done.forEach(o=>by[o.store]=(by[o.store]||0)+(+o.amt||0));
let low=0;D.products.forEach(p=>{for(const c in p.cols||{})for(const s in p.cols[c])if(+p.cols[c][s]<5)low++});
const mins=D.activity.filter(a=>a.action=='session'&&a.role=='customer').reduce((s,a)=>s+(+a.mins||0),0);
return `<h2>Overview</h2><div class="g4"><div class="kpi">Revenue (delivered)<b>${fm(done.reduce((s,o)=>s+(+o.amt||0),0))}</b></div><div class="kpi">Orders today<b>${O.filter(o=>String(o.placed).slice(0,10)==today()).length}</b></div><div class="kpi">Live orders<b>${O.filter(live).length}</b></div><div class="kpi">Customers<b>${D.customers.length}</b></div><div class="kpi">Active stores<b>${D.stores.filter(s=>s.status!='disabled').length}</b></div><div class="kpi">Products<b>${D.products.length}</b></div><div class="kpi">Need a rider<b>${D.orders.filter(o=>o.status=='dispatched'&&o.mode!='pickup'&&!o.riderName).length}</b></div><div class="kpi">Verifications pending<b>${D.stores.filter(s=>['Pending','Under Review','More Documents Required'].includes(s.verifyStatus)).length}</b></div><div class="kpi">Low-stock variants<b>${low}</b></div><div class="kpi">Customer time in app<b>${Math.round(mins)} min</b></div></div>
<h2>Revenue by store</h2>${Object.keys(by).length?Object.keys(by).map(s=>`<div class="card row sp"><b>${esc(s)}</b><span>${fm(by[s])}</span></div>`).join(''):'<p class="mu">No delivered orders yet.</p>'}<h2>Latest orders</h2>${otable(O.slice(0,8))}`}
function otable(L,m){return L.length?`<div class="tw"><table><tr><th>Order</th><th>Store</th><th>Item</th><th>Customer</th><th>Amount</th><th>Status</th><th>Placed</th>${m?'<th></th>':''}</tr>${L.map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.store)}</td><td>${esc(o.name)} · ${esc(o.color)} · ${esc(o.size)} ×${esc(o.qty)}</td><td>${esc(o.custName||o.custId)}<div class="mu">${esc(o.area)}</div></td><td>${fm(o.amt)}</td><td>${tag(o.status)}${o.mode=='pickup'?' <span class="tag y">Pickup</span>':''}</td><td>${esc(String(o.placed).replace('T',' ').slice(0,16))}</td>${m?`<td><button class="btn s y" data-a="om" data-id="${esc(o.id)}">Manage</button></td>`:''}</tr>`).join('')}</table></div>`:'<p class="mu">No orders yet.</p>'}
function orders(){const L=D.orders.filter(o=>(!T.os||o.store==T.os)&&(!T.ost||o.status==T.ost));
return `<h2>All orders (${L.length})</h2><div class="row"><select class="f" id="fs" style="width:auto"><option value="">All stores</option>${D.stores.map(s=>`<option ${T.os==s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select class="f" id="fst" style="width:auto"><option value="">All status</option>${['new','accepted','packing','dispatched','picked','done','rejected'].map(s=>`<option ${T.ost==s?'selected':''}>${s}</option>`).join('')}</select></div>${otable(L,1)}`}
function stores(){const f=T.vf||'',vs=s=>s.verifyStatus||'Verified',L=D.stores.filter(s=>!f||vs(s)==f),sts=['','Pending','Under Review','More Documents Required','Verified','Rejected','Draft'];
return `<div class="row sp"><h2>Stores</h2><button class="btn s y" data-a="se">Add store</button></div><div class="row" style="margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap">${sts.map(x=>`<button class="fchip ${f==x?'on':''}" data-a="vf" data-v="${x}">${x||'All'}${x?' ('+D.stores.filter(s=>vs(s)==x).length+')':''}</button>`).join('')}</div>${L.map(s=>`<div class="card"><div class="row sp"><b>${esc(s.name)}</b><div>${tag(vs(s))} ${s.status=='disabled'?tag('disabled'):''}</div></div><p class="mu" style="margin:4px 0">${esc(s.area)} · ${esc(s.addr)}</p><p class="mu">${esc(s.email)} · ${esc(s.phone)}</p><div class="row" style="margin-top:10px"><button class="btn s y" data-a="rv" data-id="${esc(s.id)}">${s.kyc?'Review documents':'View'}</button><button class="btn s o" data-a="se" data-id="${esc(s.id)}">Edit</button><button class="btn s ${s.status=='disabled'?'y':'r'}" data-a="st" data-id="${esc(s.id)}">${s.status=='disabled'?'Enable':'Disable'}</button></div></div>`).join('')||'<p class="mu">No stores in this status.</p>'}`}
const LBL={bizType:'Business type',bizName:'Business / trade name',pan:'PAN',panName:'Name on PAN',ownerName:'Owner',ownerPhone:'Owner mobile',ownerEmail:'Owner email',mgrName:'Manager',mgrPhone:'Manager mobile',idType:'ID proof type',idDoc:'Owner ID proof',panDoc:'PAN card',regDoc:'Registration proof',gstMode:'GST status',gstin:'GSTIN',gstDoc:'GST certificate',unregNote:'Exemption note',accName:'Account holder',bank:'Bank',accNo:'Account number',ifsc:'IFSC',chequeDoc:'Cancelled cheque / bank proof',storeName:'Store name',storeAddr:'Address',mapLink:'Google Maps',storePhone:'Store phone',storeEmail:'Business email',cats:'Categories',returns:'Return policy',dispatch:'Dispatch capability',cName:'Complaint contact',cPhone:'Complaint mobile',photos:'Store photos',brandDoc:'Brand proof',agree:'Seller agreement accepted',decl:'Accuracy declaration',sign:'Signed by'};
const STT=['PAN, business and owner identity','GST details','Bank account','Store, location and operations','Agreement and declarations'];
const kv=v=>Array.isArray(v)?v.map(kv).join('<br>'):typeof v=='boolean'?(v?'Yes':'No'):String(v).indexOf('http')==0?`<a href="${esc(v)}" target="_blank" rel="noopener">${/maps/i.test(v)?'Open map':'View document'}</a>`:esc(v);
function review(id){const s=D.stores.find(x=>x.id==id),k=(s.kyc&&typeof s.kyc=='object')?s.kyc:{};
$('#modal').innerHTML=`<div class="sheet"><div class="row sp"><h3>${esc(s.name)}</h3><button id="no">✕</button></div><p class="mu">${esc(s.owner||'')} · ${esc(s.email)} · ${esc(s.phone)}</p><p style="margin:8px 0">Status: ${tag(s.verifyStatus||'Verified')}</p>${[1,2,3,4,5].map(n=>{const d=k['s'+n];return `<h4 style="margin:14px 0 6px">${n}. ${STT[n-1]}</h4>`+(d&&Object.keys(d).length?`<table style="min-width:0">${Object.keys(d).map(x=>`<tr><td style="color:var(--mu);width:40%;white-space:normal">${LBL[x]||x}</td><td style="white-space:normal">${kv(d[x])}</td></tr>`).join('')}</table>`:'<p class="mu">Not submitted</p>')}).join('')}
<h4 style="margin:16px 0 6px">Decision</h4><textarea class="f" id="rn" rows="3" placeholder="Note to the store (required for Rejected or More Documents Required)">${esc(s.adminNote||'')}</textarea><div class="row">${['Under Review','Verified','More Documents Required','Rejected'].map(x=>`<button class="btn s ${x=='Verified'?'y':x=='Rejected'?'r':'o'}" data-vs="${x}">${x}</button>`).join('')}</div></div>`;
$('#modal').className='on';$('#no').onclick=()=>$('#modal').className='';
document.querySelectorAll('[data-vs]').forEach(b=>b.onclick=async()=>{const note=$('#rn').value.trim(),v=b.dataset.vs;if((v=='Rejected'||v=='More Documents Required')&&!note)return toast('Add a note so the store knows what to fix');
ld(b,1);const r=await A('admin.save',{sheet:'Stores',row:{id,verifyStatus:v,adminNote:note,reviewedAt:new Date().toISOString()}});ld(b,0);r.err?toast(r.err):(toast('Status updated and the store was emailed'),$('#modal').className='',await load())})}
function mgrO(id){const o=D.orders.find(x=>String(x.id)==String(id));if(!o)return;
$('#modal').innerHTML=`<div class="sheet"><div class="row sp"><h3>Order #${esc(o.orderId||o.id)}</h3><button id="no">✕</button></div><p class="mu">${esc(o.store)} · ${esc(o.name)} · ${esc(o.color)} · ${esc(o.size)} × ${esc(o.qty)} · ${fm(o.amt)}</p><p style="margin:8px 0">${esc(o.custName||'')} · ${esc(o.phone||o.custId||'')}</p><p class="mu">${esc(o.addr||'')}</p>${o.mode!='pickup'&&o.lat?`<p style="margin:6px 0"><a href="https://www.google.com/maps?q=${esc(o.lat)},${esc(o.lng)}" target="_blank" rel="noopener">Open drop location</a></p>`:''}
<label class="mu">Status</label><select class="f" id="os">${['new','accepted','packing','dispatched','picked','done','rejected'].map(x=>`<option ${o.status==x?'selected':''}>${x}</option>`).join('')}</select>
<label class="mu">Rider name</label><input class="f" id="rn1" value="${esc(o.riderName||'')}"><label class="mu">Rider phone</label><input class="f" id="rp1" value="${esc(o.riderPhone||'')}"><label class="mu">Vehicle number (optional)</label><input class="f" id="rv1" value="${esc(o.vehicle||'')}"><label class="mu">Live tracking link from Rapido or Porter (optional)</label><input class="f" id="rl1" value="${esc(o.riderLink||'')}">
<button class="btn y f" id="sv1">Save</button><p class="mu" style="margin-top:8px">Set the status to “picked” once the rider collects it, and “done” when it is delivered. The customer sees every change live.</p></div>`;
$('#modal').className='on';$('#no').onclick=()=>$('#modal').className='';
$('#sv1').onclick=async()=>{ld($('#sv1'),1);const r=await A('admin.save',{sheet:'Orders',row:{id:o.id,status:$('#os').value,riderName:$('#rn1').value.trim(),riderPhone:$('#rp1').value.trim(),vehicle:$('#rv1').value.trim(),riderLink:$('#rl1').value.trim()}});ld($('#sv1'),0);r.err?toast(r.err):(toast('Order updated. The customer sees it live.'),$('#modal').className='',await load())}}
function sform(id){const s=D.stores.find(x=>x.id==id)||{status:'active'};
$('#modal').innerHTML=`<div class="sheet"><h3>${id?'Edit':'Add'} store</h3><br><input class="f" id="sn" placeholder="Store name" value="${esc(s.name)}"><input class="f" id="sa" list="al" placeholder="Area (Hyderabad only)" value="${esc(s.area)}"><datalist id="al">${HY.map(a=>`<option>${a}</option>`).join('')}</datalist><textarea class="f" id="sd" rows="2" placeholder="Address">${esc(s.addr)}</textarea><input class="f" id="se" placeholder="Owner email (receives OTP and stock alerts)" value="${esc(s.email)}"><input class="f" id="sp" placeholder="Owner phone" value="${esc(s.phone)}"><div class="row"><button class="btn y" id="ok">Save</button><button class="btn o" id="no">Cancel</button></div></div>`;$('#modal').className='on';$('#no').onclick=()=>$('#modal').className='';
$('#ok').onclick=async()=>{const n=$('#sn').value.trim();if(!n||!$('#se').value.trim())return toast('Name and email are required');const r=await A('admin.save',{sheet:'Stores',row:{id:s.id||n.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:n,area:$('#sa').value,addr:$('#sd').value,email:$('#se').value.trim(),phone:$('#sp').value.trim(),status:s.status||'active'}});r.err?toast(r.err):(toast('Saved'),$('#modal').className='',load())}}
